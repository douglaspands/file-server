run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - goconst
    - unconvert

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
      - shadow
  revive:
    rules:
      - name: exported
        disabled: false
      - name: package-comments
        disabled: false
  gosec:
    excludes:
      - G104 # Erros não checados já cobertos por errcheck

issues:
  exclude-dirs:
    - tmp
    - bin
    - dist
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
