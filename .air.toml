root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main main.go"
  bin = "./tmp/main serve"
  full_bin = ""
  include_ext = ["go", "html", "tmpl", "css", "js", "yaml", "yml"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "dist", ".git", "openspec"]
  include_dir = ["cmd", "internal", "web"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "air.log"
  delay = 500 # ms
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500 # ms

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
