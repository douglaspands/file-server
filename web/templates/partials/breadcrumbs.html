<nav class="flex items-center space-x-1.5 sm:space-x-2 text-xs sm:text-sm text-slate-400 overflow-x-auto py-1 scrollbar-none" aria-label="Trilha de navegação">
    {{range $index, $crumb := .Breadcrumbs}}
        {{if gt $index 0}}
            <span class="text-slate-600 select-none flex-shrink-0">/</span>
        {{end}}
        {{if $crumb.IsCurrent}}
            <span class="font-semibold text-white truncate max-w-[160px] sm:max-w-xs flex-shrink-0 py-1" title="{{$crumb.Name}}">
                {{if eq $crumb.Name "Início"}}
                    <span class="flex items-center gap-1">
                        <svg class="w-4 h-4 text-indigo-400 inline flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                        </svg>
                        <span>Início</span>
                    </span>
                {{else}}
                    {{$crumb.Name}}
                {{end}}
            </span>
        {{else}}
            <a href="/files/{{$crumb.Path}}" class="hover:text-indigo-400 active:text-indigo-300 transition-colors flex items-center gap-1 truncate max-w-[140px] sm:max-w-xs flex-shrink-0 py-1" title="{{$crumb.Name}}">
                {{if eq $crumb.Name "Início"}}
                    <svg class="w-4 h-4 text-slate-400 inline flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>Início</span>
                {{else}}
                    {{$crumb.Name}}
                {{end}}
            </a>
        {{end}}
    {{end}}
</nav>
