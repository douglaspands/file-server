<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}File Server{{end}}</title>
    <!-- Tailwind CSS Standalone / CDN Fallback -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- Scripts da aplicação -->
    <script src="/static/js/app.js"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
    <header class="border-b border-slate-800 bg-slate-950/85 backdrop-blur sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
                <span class="text-xl sm:text-2xl select-none">⚡</span>
                <a href="/" class="font-bold text-lg sm:text-xl tracking-tight text-white hover:text-indigo-400 transition-colors truncate">File Server</a>
                <span class="text-[10px] sm:text-xs bg-indigo-500/20 text-indigo-400 font-mono px-2 py-0.5 rounded-md border border-indigo-500/30 flex-shrink-0">{{.Version}}</span>
            </div>
            <nav class="flex items-center space-x-3 sm:space-x-4 text-xs sm:text-sm font-medium flex-shrink-0">
                <a href="/" class="hover:text-indigo-400 transition-colors px-1 py-1">Explorador</a>
                <a href="/status" class="text-slate-400 hover:text-slate-200 transition-colors px-1 py-1">Sistema</a>
                <a href="/api/health" class="text-slate-400 hover:text-slate-200 transition-colors hidden xs:inline-block px-1 py-1">API Health</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 w-full">
        {{template "content" .}}
    </main>

    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500 bg-slate-950">
        <p>File Server &copy; 2026 - Servidor Web de Alta Performance em Go</p>
    </footer>

    {{if .IsDev}}
    <!-- Live Reload SSE Hook em modo de desenvolvimento -->
    <script>
        if (!!window.EventSource) {
            const source = new EventSource('/_live_reload');
            source.onerror = function() {
                setTimeout(() => { location.reload(); }, 1500);
            };
        }
    </script>
    {{end}}
</body>
</html>
