<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" class="rounded-xl shadow-2xl font-sans">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Window Background -->
  <rect width="960" height="620" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- GNOME HeaderBar / Titlebar -->
  <rect width="960" height="48" rx="16" fill="#0f172a" fill-opacity="0.95"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Window Controls (GNOME style right buttons) -->
  <circle cx="28" cy="24" r="7" fill="#ef4444" fill-opacity="0.9"/>
  <circle cx="48" cy="24" r="7" fill="#f59e0b" fill-opacity="0.9"/>
  <circle cx="68" cy="24" r="7" fill="#10b981" fill-opacity="0.9"/>

  <!-- App Title & Version in Header -->
  <text x="96" y="29" fill="#ffffff" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">⚡ File Server Desktop</text>
  <rect x="250" y="16" width="46" height="18" rx="4" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
  <text x="259" y="29" fill="#818cf8" font-size="10.5" font-family="monospace" font-weight="600">v1.1.0</text>

  <!-- Status Pill Header -->
  <rect x="800" y="13" width="135" height="24" rx="12" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="815" cy="25" r="4" fill="#34d399"/>
  <text x="825" y="29" fill="#6ee7b7" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">🟢 Em Execução</text>

  <!-- Segmented Control Protocols -->
  <rect x="260" y="66" width="440" height="38" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Web Tab Active -->
  <rect x="264" y="70" width="142" height="30" rx="7" fill="url(#activeTabGrad)"/>
  <text x="290" y="89" fill="#ffffff" font-size="12" font-weight="600">🌐 Web (HTTP)</text>
  
  <!-- FTP Tab Inactive -->
  <text x="440" y="89" fill="#94a3b8" font-size="12" font-weight="500">📁 FTP / FTPS</text>
  
  <!-- SFTP Tab Inactive -->
  <text x="580" y="89" fill="#94a3b8" font-size="12" font-weight="500">🔒 SFTP (SSH)</text>

  <!-- Main Layout: Grid 2 Columns -->
  <!-- Left Column: Config Panel -->
  <rect x="32" y="120" width="490" height="330" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <text x="52" y="148" fill="#e2e8f0" font-size="13" font-weight="700">⚙️ Configurações do Compartilhamento</text>
  <line x1="52" y1="160" x2="502" y2="160" stroke="#1e293b" stroke-width="1"/>

  <!-- Field: Target Directory -->
  <text x="52" y="184" fill="#94a3b8" font-size="11" font-weight="500">Pasta Compartilhada</text>
  <rect x="52" y="194" width="350" height="34" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="64" y="215" fill="#e2e8f0" font-size="12" font-family="monospace">/home/usuario/Documentos/Projetos</text>
  <rect x="410" y="194" width="92" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="424" y="215" fill="#f1f5f9" font-size="11.5" font-weight="600">📂 Procurar</text>

  <!-- Field: Host & Port -->
  <text x="52" y="250" fill="#94a3b8" font-size="11" font-weight="500">Host de Escuta</text>
  <rect x="52" y="258" width="210" height="32" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="64" y="278" fill="#e2e8f0" font-size="12" font-family="monospace">0.0.0.0 (Todos os IPs)</text>

  <text x="282" y="250" fill="#94a3b8" font-size="11" font-weight="500">Porta</text>
  <rect x="282" y="258" width="220" height="32" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="294" y="278" fill="#e2e8f0" font-size="12" font-family="monospace">8080</text>

  <!-- Field: TLS Switch -->
  <line x1="52" y1="304" x2="502" y2="304" stroke="#1e293b" stroke-width="1"/>
  <text x="52" y="326" fill="#e2e8f0" font-size="11.5" font-weight="600">Criptografia em Trânsito (HTTPS / TLS 1.3)</text>
  <text x="52" y="340" fill="#64748b" font-size="10">Certificado autoassinado automático ou customizado</text>
  <!-- Switch UI ON -->
  <rect x="454" y="318" width="48" height="24" rx="12" fill="#4f46e5"/>
  <circle cx="488" cy="330" r="9" fill="#ffffff"/>

  <!-- Action Buttons Bottom of Left Panel -->
  <line x1="52" y1="364" x2="502" y2="364" stroke="#1e293b" stroke-width="1"/>
  <rect x="52" y="380" width="180" height="42" rx="8" fill="#e11d48"/>
  <text x="96" y="405" fill="#ffffff" font-size="13" font-weight="700">■ Parar Servidor</text>

  <rect x="242" y="380" width="135" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="256" y="405" fill="#818cf8" font-size="12" font-weight="600">🚀 Abrir Browser</text>

  <rect x="385" y="380" width="117" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="397" y="405" fill="#cbd5e1" font-size="11.5" font-weight="600">📋 Compartilhar</text>

  <!-- Right Column: Network Interfaces & IPs -->
  <rect x="542" y="120" width="386" height="330" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <text x="562" y="148" fill="#e2e8f0" font-size="13" font-weight="700">🌐 Endereços de Rede</text>
  <rect x="715" y="137" width="80" height="18" rx="4" fill="#1e293b"/>
  <text x="723" y="149" fill="#94a3b8" font-size="10" font-family="monospace">4 detectados</text>
  <text x="850" y="148" fill="#818cf8" font-size="11" font-weight="600">Copiar Todos</text>
  <line x1="562" y1="160" x2="908" y2="160" stroke="#1e293b" stroke-width="1"/>

  <!-- Search Filter -->
  <rect x="562" y="170" width="346" height="28" rx="6" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="574" y="188" fill="#64748b" font-size="11">🔍 Filtrar interfaces ou IP...</text>

  <!-- Interface Cards List (Scrollable Simulation) -->
  <!-- Card 1: Wi-Fi (Recommended) -->
  <rect x="562" y="208" width="346" height="58" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>
  <text x="574" y="227" fill="#f8fafc" font-size="11.5" font-weight="700">wlan0</text>
  <rect x="620" y="216" width="46" height="16" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
  <text x="628" y="228" fill="#34d399" font-size="9" font-weight="600">Wi-Fi</text>
  <rect x="672" y="216" width="76" height="16" rx="4" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="0.8"/>
  <text x="678" y="228" fill="#a5b4fc" font-size="9" font-weight="600">⭐ Recomendado</text>

  <rect x="825" y="215" width="36" height="18" rx="4" fill="#1e293b"/>
  <text x="831" y="228" fill="#cbd5e1" font-size="9.5">📱 QR</text>
  <rect x="866" y="215" width="34" height="18" rx="4" fill="#1e293b"/>
  <text x="872" y="228" fill="#cbd5e1" font-size="9.5">📋 Copiar</text>
  <text x="574" y="252" fill="#818cf8" font-size="11" font-family="monospace">http://192.168.0.15:8080</text>

  <!-- Card 2: Localhost -->
  <rect x="562" y="272" width="346" height="52" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="574" y="291" fill="#f8fafc" font-size="11" font-weight="600">lo (Localhost)</text>
  <rect x="660" y="280" width="60" height="16" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
  <text x="668" y="291" fill="#94a3b8" font-size="9" font-weight="600">Loopback</text>
  <text x="574" y="312" fill="#818cf8" font-size="11" font-family="monospace">http://127.0.0.1:8080</text>

  <!-- Card 3: VPN Tailscale -->
  <rect x="562" y="330" width="346" height="52" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="574" y="349" fill="#f8fafc" font-size="11" font-weight="600">tailscale0</text>
  <rect x="640" y="338" width="40" height="16" rx="4" fill="#581c87" fill-opacity="0.4" stroke="#9333ea" stroke-width="0.8"/>
  <text x="648" y="349" fill="#c084fc" font-size="9" font-weight="600">VPN</text>
  <text x="574" y="370" fill="#818cf8" font-size="11" font-family="monospace">http://100.85.12.44:8080</text>

  <!-- Card 4: Docker Bridge -->
  <rect x="562" y="388" width="346" height="52" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1"/>
  <text x="574" y="407" fill="#f8fafc" font-size="11" font-weight="600">docker0</text>
  <rect x="630" y="396" width="82" height="16" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#d97706" stroke-width="0.8"/>
  <text x="636" y="407" fill="#fbbf24" font-size="9" font-weight="600">Docker / Bridge</text>
  <text x="574" y="428" fill="#818cf8" font-size="11" font-family="monospace">http://172.17.0.1:8080</text>

  <!-- Bottom Console: Terminal Logs -->
  <rect x="32" y="466" width="896" height="130" rx="10" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Console Header -->
  <rect x="32" y="466" width="896" height="28" rx="10" fill="#0f172a"/>
  <line x1="32" y1="494" x2="928" y2="494" stroke="#1e293b" stroke-width="1"/>
  <circle cx="48" cy="480" r="3.5" fill="#ef4444"/>
  <circle cx="60" cy="480" r="3.5" fill="#f59e0b"/>
  <circle cx="72" cy="480" r="3.5" fill="#10b981"/>
  <text x="86" y="484" fill="#94a3b8" font-size="11" font-family="monospace">Terminal de Eventos &amp; Logs em Tempo Real</text>
  <text x="870" y="484" fill="#64748b" font-size="10.5">🗑️ Limpar</text>

  <!-- Log Lines -->
  <text x="48" y="515" fill="#38bdf8" font-size="11" font-family="monospace">[13:30:00] ⚡ File Server Launcher Desktop v1.1.0 inicializado com sucesso!</text>
  <text x="48" y="534" fill="#34d399" font-size="11" font-family="monospace">[13:30:01] 🚀 [GUI] Servidor HTTP ativo na porta 8080 compartilhando /home/usuario/Documentos/Projetos</text>
  <text x="48" y="553" fill="#cbd5e1" font-size="11" font-family="monospace">[13:30:02] 👉 Acesso LAN (Wi-Fi): http://192.168.0.15:8080 | Localhost: http://127.0.0.1:8080</text>
  <text x="48" y="572" fill="#94a3b8" font-size="11" font-family="monospace">[13:30:05] 📡 [HTTP] GET / 200 OK (Chrome 124 Linux) - Streaming 1.2 MB/s</text>

</svg>
